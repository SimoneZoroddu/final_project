<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>
</head>

<body>

    <th:block th:fragment="navbar">
        <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
            <div class="container">

                <a class="navbar-brand" th:href="@{/}">
                    Game Store
                </a>


                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">

                    <span class="navbar-toggler-icon"></span>

                </button>


                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">
                        <!-- Games -->
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/games}">
                                Games
                            </a>
                        </li>
                        <!-- Generi -->
                        <li class="nav-item" sec:authorize="hasAuthority('ADMIN')">
                            <a class="nav-link" th:href="@{/genres}">
                                Generi
                            </a>
                        </li>
                        <!-- Piattaforme -->
                        <li class="nav-item" sec:authorize="hasAuthority('ADMIN')">
                            <a class="nav-link" th:href="@{/platforms}">
                                Piattaforme
                            </a>
                        </li>
                    </ul>
                </div>
                <div class="text-warning">
                    User: <span sec:authentication="name"></span>
                    <span class="text-danger">Roles: <span sec:authentication="principal.authorities"></span></span>
                    <a class="btn btn-primary" href="/logout">Sign out</a>
                </div>
            </div>
        </nav>
    </th:block>

</body>

</html>
