<!DOCTYPE html>
<html lang="it"
    xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>
</head>

<body>
    <th:block th:fragment="navbar">
        <nav class="navbar navbar-expand-md navbar-dark site-navbar py-3">
            <div class="container-xl">
                <a class="navbar-brand fw-bold" th:href="@{/}">
                    GAME STORE
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Apri navigazione">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/games}">Games</a>
                        </li>
                        <li class="nav-item" sec:authorize="hasAuthority('ADMIN')">
                            <a class="nav-link" th:href="@{/genres}">Generi</a>
                        </li>
                        <li class="nav-item" sec:authorize="hasAuthority('ADMIN')">
                            <a class="nav-link" th:href="@{/platforms}">Piattaforme</a>
                        </li>
                        <li class="nav-item" sec:authorize="hasAuthority('ADMIN')">
                            <a class="nav-link" th:href="@{/developers}">Sviluppatori</a>
                        </li>
                    </ul>

                    <div class="site-user-info d-flex flex-column flex-lg-row align-items-lg-center gap-2 gap-lg-3 mt-3 mt-lg-0">
                        <span>
                            <i class="bi bi-person-circle me-1"></i>
                            <span sec:authentication="name"> </span>
                            <span sec:authentication="principal.authorities"></span>
                        </span>
                        <a class="btn btn-outline-light btn-sm" th:href="@{/logout}">Sign out</a>
                    </div>
                </div>
            </div>
        </nav>
    </th:block>
</body>

</html>
