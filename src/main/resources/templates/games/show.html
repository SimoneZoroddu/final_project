<!DOCTYPE html>
<html lang="it"
    xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <th:block th:insert="~{fragments/links :: links}"></th:block>
    <title th:text="${game.title}"></title>
</head>

<body class="d-flex flex-column min-vh-100">
    <th:block th:insert="~{fragments/navbar :: navbar}"></th:block>

    <main class="single-game-page text-light flex-grow-1">
        <div class="container-xl py-5">
            <a class="btn btn-outline-light btn-sm mb-4" th:href="@{/games}">
                &larr; Torna allo Store
            </a>

            <div class="row g-5 align-items-start">
                <div class="col-lg-7">
                    <div class="single-game-cover overflow-hidden rounded-4">
                        <img th:src="@{'https://picsum.photos/seed/' + ${game.id} + '/1200/800'}"
                            class="w-100 h-100"
                            th:alt="${game.title}">
                    </div>
                </div>

                <div class="col-lg-5">
                    <div class="py-lg-3">
                        <h1 class="display-5 fw-bold mb-3" th:text="${game.title}"></h1>

                        <p class="text-secondary fs-5 mb-4"
                            th:text="${game.description != null && !#strings.isEmpty(game.description) ? game.description : 'Nessuna descrizione disponibile.'}">
                        </p>

                        <div class="d-flex flex-wrap gap-2 mb-4" th:if="${!#lists.isEmpty(game.genres)}">
                            <span th:each="genre : ${game.genres}"
                                class="badge rounded-pill text-bg-secondary px-3 py-2"
                                th:text="${genre.name}"></span>
                        </div>

                        <h3 class="fw-semibold mb-4"
                            th:text="${game.price != null ? #numbers.formatDecimal(game.price, 1, 2) + ' €' : 'Prezzo non disponibile'}">
                        </h3>

                        <div class="single-game-info">
                            <div class="d-flex justify-content-between gap-3 py-3 border-bottom border-secondary">
                                <span class="text-secondary">Sviluppatore</span>
                                <span class="text-end"
                                    th:text="${game.developer != null ? game.developer.name : 'Nessuno'}"></span>
                            </div>

                            <div class="d-flex justify-content-between gap-3 py-3 border-bottom border-secondary">
                                <span class="text-secondary">Data di uscita</span>
                                <span class="text-end"
                                    th:text="${game.releaseDate != null ? game.releaseDate : 'Non disponibile'}"></span>
                            </div>

                            <div class="d-flex justify-content-between gap-3 py-3 border-bottom border-secondary">
                                <span class="text-secondary">Piattaforme</span>
                                <div class="text-end">
                                    <span th:if="${!#lists.isEmpty(game.platforms)}">
                                        <span th:each="platform, stat : ${game.platforms}"
                                            th:text="${platform.name + (!stat.last ? ', ' : '')}"></span>
                                    </span>
                                    <span th:if="${#lists.isEmpty(game.platforms)}">Nessuna piattaforma</span>
                                </div>
                            </div>
                        </div>

                        <button type="button"
                            class="btn btn-light w-100 fw-semibold py-3 mt-4"
                            sec:authorize="!hasAuthority('ADMIN')">
                            Acquista ora
                        </button>

                        <a class="btn btn-light w-100 fw-semibold py-3 mt-4"
                            th:href="@{/games/edit/{id}(id=${game.id})}"
                            sec:authorize="hasAuthority('ADMIN')">
                            Modifica gioco
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <th:block th:insert="~{fragments/footer :: footer}"></th:block>
</body>

</html>
