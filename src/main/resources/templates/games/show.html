<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <th:block th:insert="~{fragments/links :: links}"></th:block>

    <title th:text="${game.title}"></title>
</head>


<body class="d-flex flex-column min-vh-100">

    <th:block th:insert="~{fragments/navbar :: navbar}"></th:block>


    <main class="container mt-4 flex-grow-1">


        <div class="card shadow overflow-hidden">


            <div class="row g-0">


                <div class="col-md-4 p-0 d-flex align-items-center">

                    <img th:src="@{'https://picsum.photos/seed/' + ${game.id} + '/600/800'}"
                        class="img-fluid rounded-start w-100" style="height: 100%; object-fit: cover;" alt="Game image">

                </div>



                <div class="col-md-8">

                    <div class="card-body">


                        <h1 class="card-title" th:text="${game.title}">
                        </h1>


                        <p class="card-text">

                            <strong>Descrizione:</strong>

                        </p>

                        <p th:text="${game.description}">
                        </p>



                        <hr>



                        <p>
                            <strong>Data uscita:</strong>

                            <span th:text="${game.releaseDate}">
                            </span>
                        </p>



                        <p>
                            <strong>Prezzo:</strong>

                            <span th:text="${game.price + ' €'}">
                            </span>
                        </p>



                        <p>
                            <strong>Sviluppatore:</strong>

                            <span th:text="${game.developer != null ? game.developer.name : 'Nessuno'}">
                            </span>
                        </p>



                        <p>
                            <strong>Generi:</strong>
                        </p>


                        <span th:each="genre : ${game.genres}" class="badge bg-primary me-1" th:text="${genre.name}">
                        </span>



                        <p class="mt-3">

                            <strong>Piattaforme:</strong>

                        </p>


                        <span th:each="platform : ${game.platforms}" class="badge bg-success me-1"
                            th:text="${platform.name}">
                        </span>



                        <hr>



                        <a class="btn btn-warning" th:href="@{/games/edit/{id}(id=${game.id})}"
                            sec:authorize="hasAuthority('ADMIN')">
                            Modifica
                        </a>


                        <a class="btn btn-secondary" th:href="@{/games}">
                            Torna ai Games
                        </a>



                    </div>

                </div>


            </div>


        </div>


    </main>



    <th:block th:insert="~{fragments/footer :: footer}"></th:block>


</body>

</html>
