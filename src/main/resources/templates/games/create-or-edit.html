<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <th:block th:insert="~{fragments/links :: links}"></th:block>

    <title th:text="${edit} ? 'Modifica Game' : 'Nuovo Game'"></title>
</head>

<body class="d-flex flex-column min-vh-100">

    <th:block th:insert="~{fragments/navbar :: navbar}"></th:block>

    <main class="container mt-4 flex-grow-1">

        <h1 class="mb-4" th:text="${edit} ? 'Modifica Game' : 'Nuovo Game'"></h1>

        <form th:object="${game}" th:action="${edit} ? @{/games/edit/{id}(id=${game.id})} : @{/games/create}"
            method="post">

            <div class="mb-3">
                <label class="form-label">Titolo</label>
                <input type="text" class="form-control" th:field="*{title}" th:errorClass="is-invalid">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('title')}">
                    <ul>
                        <li th:each="error : ${#fields.errors('title')}" th:text="${error}">
                        </li>
                    </ul>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Descrizione</label>
                <textarea class="form-control" rows="4" th:field="*{description}" th:errorClass="is-invalid"></textarea>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}">
                    <ul>
                        <li th:each="error : ${#fields.errors('description')}" th:text="${error}">
                        </li>
                    </ul>
                </div>

            </div>

            <div class="mb-3">
                <label class="form-label">Data di uscita</label>

                <input type="date" class="form-control" th:value="${game.releaseDate}" name="releaseDate"
                    th:errorClass="is-invalid">

                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('releaseDate')}">

                    <ul>
                        <li th:each="error : ${#fields.errors('releaseDate')}" th:text="${error}">
                        </li>
                    </ul>

                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Prezzo</label>
                <input type="number" step="0.01" class="form-control" th:field="*{price}" th:errorClass="is-invalid">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('price')}">
                    <ul>
                        <li th:each="error : ${#fields.errors('price')}" th:text="${error}">
                        </li>
                    </ul>
                </div>

            </div>

            <div class="mb-3">
                <label class="form-label">Sviluppatore</label>
                <select class="form-select" th:field="*{developer}">
                    <option value="">Seleziona uno sviluppatore</option>
                    <option th:each="developer : ${developers}" th:value="${developer.id}" th:text="${developer.name}"
                        th:errorClass="is-invalid">
                    </option>
                </select>
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('developer')}">
                    <ul>
                        <li th:each="error : ${#fields.errors('developer')}" th:text="${error}">
                        </li>
                    </ul>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Generi</label>

                <div class="form-check" th:each="genre : ${genres}">
                    <input class="form-check-input" type="checkbox" th:field="*{genres}" th:value="${genre.id}"
                        th:errorClass="is-invalid">

                    <label class="form-check-label" th:text="${genre.name}">
                    </label>
                </div>
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('genres')}">
                    <ul>
                        <li th:each="error : ${#fields.errors('genres')}" th:text="${error}">
                        </li>
                    </ul>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Piattaforme</label>

                <div class="form-check" th:each="platform : ${platforms}">
                    <input class="form-check-input" type="checkbox" th:field="*{platforms}" th:value="${platform.id}"
                        th:errorClass="is-invalid">

                    <label class="form-check-label" th:text="${platform.name}">
                    </label>
                </div>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('platforms')}">
                    <ul>
                        <li th:each="error : ${#fields.errors('platforms')}" th:text="${error}">
                        </li>
                    </ul>
                </div>
            </div>

            <button type="submit" class="btn btn-primary" th:text="${edit} ? 'Salva modifiche' : 'Crea Game'">
            </button>

            <a th:href="@{/games}" class="btn btn-secondary">
                Annulla
            </a>

        </form>

    </main>

    <th:block th:insert="~{fragments/footer :: footer}"></th:block>

</body>

</html>
