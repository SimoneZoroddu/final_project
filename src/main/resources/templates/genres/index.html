<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <th:block th:insert="~{fragments/links :: links}"></th:block>

    <title>Generi</title>
</head>

<body class="d-flex flex-column min-vh-100">

    <th:block th:insert="~{fragments/navbar :: navbar}"></th:block>


    <main class="container mt-4 flex-grow-1">

        <div class="d-flex justify-content-between align-items-center mb-3">

            <h1>Lista Generi</h1>

            <a class="btn btn-primary" th:href="@{/genres/create}">
                Nuovo Genere
            </a>

        </div>


        <table class="table table-striped table-bordered">

            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Azioni</th>
                </tr>
            </thead>


            <tbody>

                <tr th:each="genre : ${genres}">

                    <td th:text="${genre.id}"></td>

                    <td th:text="${genre.name}"></td>


                    <td>

                        <a class="btn btn-warning btn-sm" th:href="@{/genres/edit/{id}(id=${genre.id})}">
                            Modifica
                        </a>


                        <form th:action="@{/genres/delete/{id}(id=${genre.id})}" method="post" style="display:inline">

                            <button class="btn btn-danger btn-sm" onclick="return confirm('Eliminare genere?')">
                                Elimina
                            </button>

                        </form>

                    </td>

                </tr>

            </tbody>

        </table>


    </main>


    <th:block th:insert="~{fragments/footer :: footer}"></th:block>


</body>

</html>
